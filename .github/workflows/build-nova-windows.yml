name: Build Nova Launcher (Windows exe)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: 'true'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4          # версия берётся из packageManager в package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Rust toolchain (из rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Env-файл для app-lib (прод-адреса Modrinth API)
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Установка JS-зависимостей
        run: pnpm install --no-frozen-lockfile --filter "@modrinth/app" --filter "@modrinth/app-frontend"

      - name: Иконка лаунчера
        shell: bash
        run: |
          python -m pip install pillow
          python branding/make_icon.py branding/icon.png
          pnpm --filter @modrinth/app exec tauri icon ../../branding/icon.png

      - name: Сборка (frontend + Rust-ядро Theseus + установщик)
        run: pnpm --filter @modrinth/app exec tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: Nova-Launcher-windows
          path: |
            target/release/Nova Launcher.exe
            target/release/bundle/nsis/*.exe
